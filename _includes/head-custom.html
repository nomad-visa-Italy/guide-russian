<!-- Mermaid-диаграммы на GitHub Pages.
     Тема (jekyll-theme-primer) сама mermaid не рисует — нужна библиотека.
     Рендерер отдаёт ```mermaid как:
       CommonMark: <pre lang="mermaid"><code>…</code></pre>
       kramdown:   <pre><code class="language-mermaid">…</code></pre>
     Ниже эти блоки превращаются в <pre class="mermaid"> и рендерятся. -->
<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
  document.addEventListener("DOMContentLoaded", () => {
    const blocks = document.querySelectorAll(
      'pre[lang="mermaid"], pre > code.language-mermaid, code.language-mermaid'
    );
    blocks.forEach((el) => {
      const pre = el.tagName === "PRE" ? el : el.closest("pre") || el.parentElement;
      const code = pre.querySelector("code") || el;
      const graph = document.createElement("pre");
      graph.className = "mermaid";
      graph.textContent = code.textContent;
      pre.replaceWith(graph);
    });
    if (document.querySelector(".mermaid")) {
      mermaid.initialize({ startOnLoad: false });
      mermaid.run();
    }
  });
</script>
