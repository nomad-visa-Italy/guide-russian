# GitHub Pages / Jekyll
# Рендерер — CommonMark (строгий GFM): таблица создаётся ТОЛЬКО при наличии
# строки-разделителя |---|. Поэтому строки-цитаты «текст | [источник] | дата»
# рендерятся как обычный текст, а не как таблица.
# (kramdown, даже в режиме input: GFM, делал таблицу из любой строки с |.)
markdown: CommonMarkGhPages
